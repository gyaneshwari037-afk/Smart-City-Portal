async function loadLiveCityServices() {
    const query = `
        [out:json][timeout:45];
        (
          nwr(around:15000,17.6868,83.2185)["amenity"~"hospital|clinic|doctors|dentist|pharmacy|nursing_home|police|fire_station|ambulance_station|bus_station|bus_stop|taxi|ferry_terminal|parking|bicycle_rental|car_rental|recycling|waste_disposal|waste_transfer_station|recycling_centre|drinking_water|fountain|charging_station|school|college|university|kindergarten|library|post_office|townhall|community_centre|courthouse|public_building|toilets|marketplace"];
          nwr(around:15000,17.6868,83.2185)["healthcare"~"hospital|clinic|doctor|dentist|pharmacy|centre|laboratory"];
          nwr(around:15000,17.6868,83.2185)["highway"="bus_stop"];
          nwr(around:15000,17.6868,83.2185)["public_transport"~"platform|station|stop_position"];
          nwr(around:15000,17.6868,83.2185)["railway"~"station|halt|tram_stop"];
          nwr(around:15000,17.6868,83.2185)["leisure"~"park|playground|garden|nature_reserve"];
          nwr(around:15000,17.6868,83.2185)["man_made"~"water_works|reservoir_covered"];
          nwr(around:15000,17.6868,83.2185)["office"~"water_utility|energy_supplier"];
          nwr(around:15000,17.6868,83.2185)["power"~"plant|substation|generator"];
          nwr(around:15000,17.6868,83.2185)["emergency"="ambulance_station"];
        );
        out center tags;
    `;
    try {
        const overpassServers = [
            "https://overpass-api.de/api/interpreter",
            "https://overpass.kumi.systems/api/interpreter",
            "https://overpass.private.coffee/api/interpreter"
        ];

        let response = null;
        let lastError = null;

        for (const server of overpassServers) {
            try {
                console.log("Trying OpenStreetMap server:", server);

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 55000);

                try {
                    response = await fetch(server, {
                        method: "POST",
                        body: new URLSearchParams({ data: query }),
                        signal: controller.signal
                    });
                } finally {
                    clearTimeout(timeoutId);
                }

                if (!response.ok) {
                    throw new Error("Server returned HTTP " + response.status);
                }

                break;
            } catch (error) {
                lastError = error;
                response = null;
                console.warn("OpenStreetMap server failed:", server, error.message);
            }
        }

        if (!response) {
            throw new Error(
                "All OpenStreetMap servers failed. Please try again later. " +
                (lastError ? lastError.message : "")
            );
        }
        const data = await response.json();

if (!data || !Array.isArray(data.elements)) {
    throw new Error("The OpenStreetMap server returned an invalid response.");
}

let addedCount = 0;

        data.elements.forEach(function (place) {
            const tags = place.tags || {};

            const lat = place.lat ?? place.center?.lat;
            const lng = place.lon ?? place.center?.lon;

            if (lat == null || lng == null) return;

            let type = "";

            if (
                ["hospital", "clinic", "doctors", "dentist", "pharmacy", "nursing_home", "ambulance_station"].includes(tags.amenity) ||
                tags.emergency === "ambulance_station" ||
                ["hospital", "clinic", "doctor", "dentist", "pharmacy", "centre", "laboratory"].includes(tags.healthcare)
            ) {
                type = "hospital";
            } else if (tags.amenity === "police") {
                type = "police";
            } else if (tags.amenity === "fire_station") {
                type = "fire";
            } else if (
                ["bus_station", "bus_stop", "taxi", "ferry_terminal", "parking", "bicycle_rental", "car_rental"].includes(tags.amenity) ||
                tags.highway === "bus_stop" ||
                ["platform", "station", "stop_position"].includes(tags.public_transport) ||
                ["station", "halt", "tram_stop"].includes(tags.railway)
            ) {
                type = "transport";
            } else if (["park", "playground", "garden", "nature_reserve"].includes(tags.leisure)) {
                type = "park";
            } else if (
                ["water_works", "reservoir_covered"].includes(tags.man_made) ||
                tags.office === "water_utility" ||
                ["drinking_water", "fountain"].includes(tags.amenity)
            ) {
                type = "water";
            } else if (
                tags.office === "energy_supplier" ||
                ["plant", "substation", "generator"].includes(tags.power) ||
                tags.amenity === "charging_station"
            ) {
                type = "electricity";
            } else if (
                [
                    "recycling",
                    "waste_disposal",
                    "waste_transfer_station",
                    "recycling_centre"
                ].includes(tags.amenity)
            ) {
                type = "waste";
            } else if ([
                "school", "college", "university", "kindergarten", "library", "post_office",
                "townhall", "community_centre", "courthouse", "public_building", "toilets", "marketplace"
            ].includes(tags.amenity)) {
                type = "public";

          const name = tags.name || tags["name:en"] || "Unnamed mapped location";
const normalizedName = name.trim().toLowerCase();

const duplicate = services.some(function (service) {
    if (service.type !== type) return false;

    const existingName = (service.name || "").trim().toLowerCase();

    // Compare names only when both locations have real names.
    const hasRealName =
        normalizedName !== "unnamed mapped location" &&
        existingName !== "" &&
        existingName !== "unnamed mapped location";

    const sameName = hasRealName && existingName === normalizedName;

    // Also prevent duplicate markers at almost identical coordinates.
    const sameLocation =
        Number.isFinite(Number(service.lat)) &&
        Number.isFinite(Number(service.lng)) &&
        Math.abs(Number(service.lat) - Number(lat)) < 0.0001 &&
        Math.abs(Number(service.lng) - Number(lng)) < 0.0001;

    return sameName || sameLocation;

});

if (duplicate) return;
            const address = [

            ].filter(Boolean).join(" | ");

            });

            addedCount++;

                : `No additional mapped locations were returned this time. Existing project locations are still available; please try again later.`;
        }

        console.log(
            "OpenStreetMap locations added:",

    } catch (error) {
        const liveMapStatus = document.getElementById("liveMapStatus");

mapSearchResults.replaceChildren();

const matches = services.filter(function (service) {

    return;
}

matches.slice(0, 30).forEach(function (service) {
    const resultButton = document.createElement("button");

    resultButton.type = "button";
    resultButton.className = "map-search-result";
    resultButton.textContent =
        service.name + " — " + service.type;

    resultButton.addEventListener("click", function () {
        map.setView([service.lat, service.lng], 16);

        // Open the matching marker's popup when available.
        const matchingMarker = markers.find(function (marker) {
            const position = marker.getLatLng();

            return Math.abs(position.lat - Number(service.lat)) < 0.000001 &&
                Math.abs(position.lng - Number(service.lng)) < 0.000001;
        });

        if (matchingMarker) {
            matchingMarker.openPopup();
        } else {
            alert(
                "Location found: " + service.name +
                "\nThis location is not currently displayed as a map marker."
            );
        }
    });

    mapSearchResults.appendChild(resultButton);
});

if (matches.length > 30) {
    const note = document.createElement("p");
    note.textContent = "Showing the first 30 results. Add a more specific search.";
    mapSearchResults.appendChild(note);
}

}

mapSearchButton.addEventListener("click", searchMapLocations);

mapSearchInput.addEventListener("keydown", function (event) {
if (event.key === "Enter") {
searchMapLocations();
}
});

mapClearButton.addEventListener("click", function () {
mapSearchInput.value = "";
mapSearchResults.replaceChildren();
mapSearchInput.focus();
});

}
// ========================================
// MY CURRENT LOCATION
// ========================================

const myLocationButton = document.getElementById("myLocationButton");
const myLocationMessage = document.getElementById("myLocationMessage");

let myLocationMarker = null;
let myLocationCircle = null;

myLocationButton.addEventListener("click", function () {
if (!navigator.geolocation) {
myLocationMessage.textContent =
"Your browser does not support location access.";
return;
}
myLocationMessage.textContent = "Finding your location...";
myLocationButton.disabled = true;

navigator.geolocation.getCurrentPosition(
    function (position) {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        if (myLocationMarker) {
            map.removeLayer(myLocationMarker);
        }

        if (myLocationCircle) {
            map.removeLayer(myLocationCircle);
        }

        myLocationMarker = L.marker([userLat, userLng])
            .addTo(map)
            .bindPopup("<b>📍 You are here!</b>")
            .openPopup();

        myLocationCircle = L.circle([userLat, userLng], {
            radius: accuracy,
            color: "#2563eb",
            fillOpacity: 0.12
        }).addTo(map);

        map.setView([userLat, userLng], 15);

        myLocationMessage.textContent =
            "Location found! Accuracy: approximately " +
            Math.round(accuracy) + " metres.";

        myLocationButton.disabled = false;
    },

    function (error) {
        const messages = {
            1: "Location permission denied. Allow location access in your browser.",
            2: "Your location is currently unavailable. Please try again.",
            3: "Location request timed out. Please try again."
        };

        myLocationMessage.textContent =
            messages[error.code] || "Unable to find your location.";

        myLocationButton.disabled = false;
    },

    {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
    }
);


});


loadLiveCityServices();

const selectedService = urlParams.get("service");

if (selectedService) {
    displayServices(selectedService);
} else {
    displayServices("all");
}
